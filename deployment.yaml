apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-transport-monitor
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: public-transport-monitor
  template:
    metadata:
      labels:
        app: public-transport-monitor
    spec:
      containers:
        - name: public-transport-monitor
          image: harshid2007/public-transport-monitor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: public-transport-monitor
spec:
  type: NodePort
  selector:
    app: public-transport-monitor
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
